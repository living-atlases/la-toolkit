name: la_toolkit_core
description: LA Toolkit domain model (projects, servers, services, placement), its validation and the generator configuration, without Flutter. Shared by the app, the CLI and the MCP server.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.8.0

dependencies:
  # https://github.com/porn/area/pull/2
  area:
    git:
      url: https://github.com/DirkoOdendaal/area.git
      ref: feature/migrate-to-null-safety-dart-2.12
  collection: ^1.17.1
  # Same major as the app's lock: the committed *.g.dart were generated by it,
  # and copy_with_extension_gen >= 15 rejects LAProject's constructor.
  copy_with_extension: ^14.0.0
  json_annotation: ^4.11.0
  latlong2: ^0.9.0
  meta: ^1.9.0
  objectid: ^3.0.0
  pub_semver: ^2.0.0
  tuple: ^2.0.0
  yaml: ^3.1.2
  yaml_extension: ^1.0.2

dev_dependencies:
  build_runner: ^2.13.1
  copy_with_extension_gen: ^14.0.0
  json_serializable: ^6.13.1
  lints: ^5.0.0
  test: any
