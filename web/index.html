<!DOCTYPE html>
<html>
<head>
    <!--
      If you are serving your web app in a path other than the root, change the
      href value below to reflect the base path you are serving from.

      The path provided below has to start and end with a slash "/" in order for
      it to work correctly.

      For more details:
      * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

      This is a placeholder for base href that will be replaced by the value of

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta content="Living Atlases Toolkit" name="description"/>

    <!-- iOS meta tags & icons -->
    <meta content="yes" name="apple-mobile-web-app-capable">

    <meta content="la_toolkit" name="apple-mobile-web-app-title">
    <link href="icons/Icon-192.png" rel="apple-touch-icon">

    <!-- Favicon -->
    <link href="./favicon.ico" rel="shortcut icon" type="image/x-icon"/>

    <title>Living Atlases Toolkit</title>
    <link href="styles.css" rel="stylesheet" type="text/css"/>
    <link crossorigin="use-credentials" href="manifest.json" rel="manifest">
</head>
<body>
<div class="hero">
    <img class="splash-image center" src="img/la-toolkit-logo.png"/>
</div>
<script src="flutter_bootstrap.js" async></script>
